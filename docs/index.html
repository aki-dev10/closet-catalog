<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="服カタログ">
<meta name="theme-color" content="#f6f4ef">
<title>服カタログ</title>
<style>
:root {
  --bg: #f6f4ef; --card: #fff; --ink: #24262b; --sub: #6c7078; --line: #e2ded5;
  --accent: #2f5d50; --accent-ink: #fff; --warn: #b4571c; --danger: #a8322d;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17191c; --card: #22252a; --ink: #eceae5; --sub: #9a9fa8; --line: #33373e;
          --accent: #6fb39f; --accent-ink: #10201b; --warn: #e39a5c; --danger: #e5766f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px; }
.bar { display: flex; align-items: center; gap: 8px; }
h1 { font-size: 18px; margin: 0; flex: 1; }
#sync { font-size: 12px; color: var(--sub); margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters select, .filters label { flex: none; border: 1px solid var(--line); background: var(--card);
  border-radius: 8px; padding: 6px 8px; font-size: 13px; }
.filters label { display: flex; align-items: center; gap: 4px; }
.filters button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.filters button.on, .filters button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tile.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
@media (max-width: 699px) { .filters { flex-wrap: nowrap; overflow-x: auto; } .filters > * { flex: none; } #btnAdd { order: -1; } #sync { margin-left: 0; } }
body.selmode main { padding-bottom: 150px; }
#bulk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#bulk input, #bulk select { flex: 1; min-width: 130px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px; font-size: 16px; }
#bulkN { font-size: 13px; color: var(--sub); width: 100%; }
.sum table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sum th, .sum td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.sum th:first-child, .sum td:first-child { text-align: left; }
.sum h3 { margin: 8px 0 2px; font-size: 13px; color: var(--sub); }
.sum .box { font-size: 15px; font-weight: 600; }
main { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
#count { color: var(--sub); font-size: 13px; cursor: help; white-space: nowrap; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
@media (min-width: 700px) { #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
.tile { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; cursor: pointer; padding: 0; text-align: left; display: block; width: 100%; }
.tile img, .tile .ph { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: var(--line); }
.tile .cap { padding: 6px 8px 8px; font-size: 12px; }
.tile .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.tile .sb { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ht { background: linear-gradient(90deg, #e6007e, #e60012 55%, #f08300); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; letter-spacing: .02em; }
.hb { position: absolute; top: 6px; right: 6px; background: #fff; border-radius: 4px; padding: 1px 5px; font-size: 9px; line-height: 1.4; }
.checks label:has(#eHeat:checked) { background: #fff; border-color: #e60012; box-shadow: 0 0 0 1px #e60012; }
.badge { position: absolute; top: 6px; left: 6px; background: var(--warn); color: #fff; font-size: 11px;
  border-radius: 6px; padding: 1px 6px; }
.tile.gone img { opacity: .4; }
.tile.sport .cap { background: #e3f0fc; }
.brk { grid-column: 1 / -1; height: 4px; }
@media (prefers-color-scheme: dark) { .tile.sport .cap { background: #1d2f42; } }
.tile.busy { cursor: default; }
.tile.busy .ph { display: grid; place-items: center; color: var(--sub); font-size: 12px; }
.empty { color: var(--sub); text-align: center; padding: 48px 0; }
dialog { border: none; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px));
  max-height: calc(100dvh - 24px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.5); }
.dlg { padding: 16px; display: grid; gap: 10px; }
.dlg h2 { margin: 0; font-size: 16px; }
.dlg .photo { width: 100%; max-height: 42vh; object-fit: contain; background: var(--bg); border-radius: 8px; }
.rot { display: flex; justify-content: center; gap: 12px; }
.rot .btn { display: grid; place-items: center; padding: 6px 16px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f { display: grid; gap: 3px; font-size: 12px; color: var(--sub); min-width: 0; }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
  padding: 8px; font-size: 16px; color: var(--ink); width: 100%; min-width: 0; }
.checks { display: flex; gap: 6px; flex-wrap: wrap; }
.checks label { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; color: var(--ink); font-size: 14px; }
.checks label:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.checks input { position: absolute; opacity: 0; pointer-events: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
.actions .sp { flex: 1; }
.note { font-size: 12px; color: var(--sub); }
#msg { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px;
  max-width: calc(100vw - 32px); z-index: 20; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="filters">
    <select id="fType" aria-label="種類"></select>
    <select id="fSeason" aria-label="季節"></select>
    <select id="fOwner" aria-label="持ち主"></select>
    <select id="fColor" aria-label="色"></select>
    <select id="fStatus" aria-label="状態"></select>
    <label><input type="checkbox" id="fReview"> 要確認のみ</label>
    <button type="button" id="btnSel">まとめて変更</button>
    <button type="button" id="btnSum">集計</button>
    <span id="sync"></span>
    <button type="button" id="btnCfg">設定</button>
    <span id="count"></span>
    <button type="button" class="primary" id="btnAdd">＋ 服を追加</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>
</header>
<main>
  <div id="grid"></div>
  <div class="empty" id="empty" hidden>まだ登録がありません。「＋ 服を追加」から写真を選んでください。</div>
</main>

<dialog id="dlgEdit">
  <form class="dlg" id="formEdit">
    <img class="photo" id="ePhoto" alt="">
    <div class="rot">
      <button type="button" class="btn" id="eRotL" aria-label="左に90度回転" title="左に90度回転"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button type="button" class="btn" id="eRotR" aria-label="右に90度回転" title="右に90度回転"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
    <label class="f">名称<input id="eName" maxlength="40"></label>
    <div class="row">
      <label class="f">種類<select id="eType"></select></label>
      <label class="f">持ち主<input id="eOwner" list="dlOwner"><datalist id="dlOwner"></datalist></label>
    </div>
    <div class="f">季節<div class="checks" id="eSeasons"></div></div>
    <div class="f">タグ<div class="checks"><label><input type="checkbox" id="eHeat"><span class="ht">HEATTECH</span></label></div></div>
    <div class="row">
      <label class="f">色<input id="eColor" maxlength="20" list="dlColor"><datalist id="dlColor"></datalist></label>
      <label class="f">状態<select id="eStatus"></select></label>
    </div>
    <div class="row">
      <label class="f">収納場所<input id="ePlace" list="dlPlace" placeholder="例: クローゼット、BOX-1"><datalist id="dlPlace"></datalist></label>
      <label class="f">かさ（L）<input id="eVolume" type="number" min="0" step="0.1" inputmode="decimal"></label>
    </div>
    <div class="row">
      <label class="f">購入価格（円）<input id="ePrice" type="number" min="0" step="1" inputmode="numeric"></label>
      <label class="f">メモ<input id="eMemo"></label>
    </div>
    <div class="note" id="eInfo"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="eDelete">完全に削除</button>
      <button type="button" class="btn" id="eDispose">処分済みにする</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="eCancel">閉じる</button>
      <button type="submit" class="btn primary" id="eSave">保存</button>
    </div>
  </form>
</dialog>

<dialog id="dlgCfg">
  <form class="dlg" id="formCfg">
    <h2>接続の設定</h2>
    <div class="note">合言葉は、この端末で最初に1回だけ入力します。</div>
    <label class="f">データのURL（通常は変更不要）<input id="cUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="f">合言葉<input id="cPass" type="password" required autocomplete="current-password"></label>
    <label class="f">AIのモデル<select id="cModel"><option value="sonnet">Sonnet（高精度）</option><option value="haiku">Haiku（速い・安い）</option></select></label>
    <div class="actions">
      <button type="button" class="btn" id="cShare">他の端末用リンクをコピー</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="cCancel">閉じる</button>
      <button type="submit" class="btn primary">保存して接続</button>
    </div>
  </form>
</dialog>

<dialog id="dlgSum">
  <div class="dlg sum">
    <h2>集計</h2>
    <div class="note">いま一覧に表示している服が対象です。季節や状態で絞り込んでから開くと、その分だけ計算します。</div>
    <div id="sumBody"></div>
    <h3>BOXの目安</h3>
    <label class="f">BOX 1個の容量（L）<input id="sBox" type="number" min="1" step="1" inputmode="numeric"></label>
    <div class="box" id="sumBox"></div>
    <div class="note">容量の8割まで詰める想定の概算です。</div>
    <div class="actions"><button type="button" class="btn" id="sClose">閉じる</button></div>
  </div>
</dialog>

<div id="bulk" hidden>
  <div id="bulkN"></div>
  <input id="bPlace" list="dlPlace" placeholder="収納場所（変えないなら空欄）">
  <select id="bStatus"></select>
  <button class="btn" id="bAll">表示中をすべて選択</button>
  <button class="btn" id="bTidy">写真をAIで整える</button>
  <button class="btn primary" id="bApply">適用</button>
</div>

<div id="msg" hidden></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const LS_CFG = 'closet.cfg', LS_FILTER = 'closet.filter', LS_BOX = 'closet.box';
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbxD0iBAGK9b_sbjS_Iyd4sjf1DcdiiWK0wrf61wtsIHMClc-EpcaMVWtCiOw3xdD6Zs/exec';
let cfg = load(LS_CFG) || { url: '', pass: '', model: 'sonnet' };
if (!cfg.url) cfg.url = DEFAULT_URL;
let items = [];
let meta = { types: [], seasons: ['春秋', '夏', '冬'], statuses: ['使用中', '保管中', '処分候補', '処分済み'], owners: [] };
let pending = [];      // 登録中の仮タイル
let editing = null;
let selMode = false;
const selected = new Set();

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

// ---------- 端末内キャッシュ (IndexedDB) ----------
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('closet', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function cacheGet(key) {
  try {
    const db = await idb();
    return await new Promise(res => {
      const q = db.transaction('kv').objectStore('kv').get(key);
      q.onsuccess = () => res(q.result); q.onerror = () => res(undefined);
    });
  } catch (e) { return undefined; }
}
async function cacheSet(key, val) {
  try { const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').put(val, key); } catch (e) { }
}
function persist() { cacheSet('items', items); cacheSet('meta', meta); }

// ---------- 通信 ----------
async function api(action, data) {
  // Content-Type を指定しない(text/plain)ことでプリフライトを避ける
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ pass: cfg.pass, action }, data)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error === 'auth' ? '合言葉が違います' : j.error);
  return j;
}

let msgTimer;
function toast(t, ms) {
  $('msg').textContent = t; $('msg').hidden = false;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => $('msg').hidden = true, ms || 3500);
}

async function sync() {
  if (!cfg.url) return;
  $('sync').textContent = '更新中…';
  try {
    const thumbs = new Map(items.filter(i => i.thumb).map(i => [i.photoId, i.thumb]));
    const j = await api('list', { have: [...thumbs.keys()] });
    items = j.items.map(i => i.thumb ? i : Object.assign(i, { thumb: thumbs.get(i.photoId) || '' }));
    meta = j.meta;
    persist(); buildOptions(); render();
    $('sync').textContent = '';
  } catch (e) {
    $('sync').textContent = '未更新';
    toast('更新できませんでした: ' + e.message, 6000);
    if (e.message === '合言葉が違います') openCfg();
  }
}

// ---------- 表示 ----------
function opt(sel, list, first) {
  const cur = sel.value;
  sel.replaceChildren(...(first ? [new Option(first[1], first[0])] : []), ...list.map(v => Array.isArray(v) ? new Option(v[1], v[0]) : new Option(v, v)));
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}
function buildOptions() {
  const f = load(LS_FILTER) || {};
  const types = meta.types.map(t => t.name);
  const owners = [...new Set([...meta.owners, ...items.map(i => i.owner).filter(Boolean)])];
  opt($('fType'), types, ['', '種類: すべて']);
  opt($('fSeason'), meta.seasons, ['', '季節: すべて']);
  opt($('fOwner'), owners, ['', '持ち主: すべて']);
  const used = new Set(items.map(i => i.color).filter(Boolean));
  opt($('fColor'), [...(meta.colors || []).filter(c => used.has(c)), ...[...used].filter(c => !(meta.colors || []).includes(c))], ['', '色: すべて']);
  opt($('fStatus'), [...meta.statuses, ['*', '状態: すべて']], ['', '処分済み以外']);
  if (!buildOptions.done) {
    for (const k of ['fType', 'fSeason', 'fOwner', 'fColor', 'fStatus']) if (f[k] && [...$(k).options].some(o => o.value === f[k])) $(k).value = f[k];
    buildOptions.done = true;
  }
  opt($('eType'), types);
  opt($('eStatus'), meta.statuses);
  opt($('bStatus'), meta.statuses, ['', '状態: 変えない']);
  $('dlColor').replaceChildren(...(meta.colors || []).map(o => new Option(o)));
  $('dlOwner').replaceChildren(...owners.map(o => new Option(o)));
  $('dlPlace').replaceChildren(...[...new Set(items.map(i => i.place).filter(Boolean))].map(o => new Option(o)));
  if ($('eSeasons').children.length !== meta.seasons.length) {
    $('eSeasons').replaceChildren(...meta.seasons.map(s => {
      const l = document.createElement('label'), c = document.createElement('input');
      c.type = 'checkbox'; c.value = s; l.append(c, s); return l;
    }));
  }
}

function hasTag(it, t) { return (it.tags || '').split(',').includes(t); }
function seasonLabel(s) {
  const a = (s || '').split(',').filter(Boolean);
  return a.length >= meta.seasons.length ? '通年' : a.join('');
}

const TOPS = ['Tシャツ', 'シャツ', 'ニット', 'パーカー・スウェット', 'ジャケット', 'コート・ダウン'];
// 並び順: 長袖 → 半袖 → 長ズボン → 半ズボン → その他 → スポーツウェア（最後）
function rank(i) {
  if (i.type === 'スポーツウェア') return /パンツ|ショーツ|ズボン|タイツ|レギンス|スパッツ/.test(i.name) ? 920 : /長袖/.test(i.name) ? 900 : 910;
  if (i.type === 'パンツ') return 300;
  if (i.type === 'ショートパンツ') return 400;
  const t = TOPS.indexOf(i.type);
  if (t >= 0) {
    const short = /半袖|ノースリーブ|タンク/.test(i.name) || (i.type === 'Tシャツ' && !/長袖/.test(i.name));
    return (short ? 200 : 100) + t;
  }
  const k = meta.types.findIndex(x => x.name === i.type);
  return 600 + (k < 0 ? 99 : k);
}
// 改行の区切り: トップス / ボトムス / その他 / スポーツウェア
function group(i) { const r = rank(i); return r < 300 ? 0 : r < 600 ? 1 : r < 900 ? 2 : 3; }
function visible() {
  const t = $('fType').value, s = $('fSeason').value, o = $('fOwner').value, c = $('fColor').value, st = $('fStatus').value, rv = $('fReview').checked;
  return items.filter(i =>
    (!t || i.type === t) && (!s || (i.seasons || '').split(',').includes(s)) && (!o || i.owner === o) && (!c || i.color === c) &&
    (st === '*' || (st ? i.status === st : i.status !== '処分済み')) && (!rv || i.review === '未確認')
  ).sort((a, b) => rank(a) - rank(b) || b.created.localeCompare(a.created) || b.id.localeCompare(a.id));
}

function render() {
  const list = visible();
  const nodes = pending.map(p => {
    const d = document.createElement('div'); d.className = 'tile busy';
    const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = p.label;
    d.append(ph); return d;
  });
  let lastGroup = null;
  for (const it of list) {
    const grp = group(it);
    if (lastGroup !== null && grp !== lastGroup) { const k = document.createElement('div'); k.className = 'brk'; nodes.push(k); }
    lastGroup = grp;
    const b = document.createElement('button');
    b.className = 'tile' + (it.status === '処分済み' ? ' gone' : '') + (selected.has(it.id) ? ' sel' : '') + (it.type === 'スポーツウェア' ? ' sport' : '');
    b.dataset.id = it.id;
    const img = document.createElement(it.thumb ? 'img' : 'div');
    if (it.thumb) { img.src = it.thumb; img.alt = it.name; img.loading = 'lazy'; } else img.className = 'ph';
    const cap = document.createElement('div'); cap.className = 'cap';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name || '（名称なし）';
    const sb = document.createElement('div'); sb.className = 'sb';
    sb.textContent = [it.type, seasonLabel(it.seasons), it.status !== '使用中' ? it.status : ''].filter(Boolean).join('・');
    cap.append(nm, sb); b.append(img, cap);
    if (it.review === '未確認') { const g = document.createElement('span'); g.className = 'badge'; g.textContent = '要確認'; b.append(g); }
    if (hasTag(it, 'HEATTECH')) { const g = document.createElement('span'); g.className = 'hb'; const x = document.createElement('span'); x.className = 'ht'; x.textContent = 'HEATTECH'; g.append(x); b.append(g); }
    nodes.push(b);
  }
  $('grid').replaceChildren(...nodes);
  const vol = list.reduce((a, i) => a + (Number(i.volume) || 0), 0);
  const yen = list.reduce((a, i) => a + (Number(i.price) || 0), 0);
  $('count').textContent = list.length + ' 点' + (list.length ? ' ⓘ' : '');
  $('count').title = list.length ? 'かさ 約 ' + Math.round(vol) + ' L' + (yen ? '・購入価格 計 ¥' + yen.toLocaleString('ja-JP') : '') : '';
  $('bulk').hidden = !selMode; document.body.classList.toggle('selmode', selMode);
  $('bulkN').textContent = selected.size + ' 点を選択中。タップで選択／解除';
  $('empty').hidden = items.length > 0 || pending.length > 0 || !cfg.url;
}

// ---------- 写真の縮小 ----------
async function decode(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { }
  return await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => rej(new Error('この形式の写真は読み込めません'));
    im.src = URL.createObjectURL(file);
  });
}
function draw(src, max, square) {
  const w = src.width, h = src.height, c = document.createElement('canvas');
  if (square) {
    const s = Math.min(w, h); c.width = c.height = max;
    c.getContext('2d').drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, max, max);
  } else {
    const k = Math.min(1, max / Math.max(w, h));
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  }
  return c;
}
function rotated(src, deg) {
  const c = document.createElement('canvas'), swap = deg % 180 !== 0;
  c.width = swap ? src.height : src.width; c.height = swap ? src.width : src.height;
  const x = c.getContext('2d');
  x.translate(c.width / 2, c.height / 2); x.rotate(deg * Math.PI / 180);
  x.drawImage(src, -src.width / 2, -src.height / 2);
  return c;
}
function cropped(src, box) {
  if (!box) return src;
  const m = 0.04, w = src.width, h = src.height;
  const x0 = Math.max(0, box[0] - m) * w, y0 = Math.max(0, box[1] - m) * h;
  const x1 = Math.min(1, box[2] + m) * w, y1 = Math.min(1, box[3] + m) * h;
  if ((x1 - x0) * (y1 - y0) > w * h * 0.9) return src;
  const c = document.createElement('canvas'); c.width = Math.round(x1 - x0); c.height = Math.round(y1 - y0);
  c.getContext('2d').drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  return c;
}
// 余白カットと回転。何も変わらないときは null
function tidy(src, rotate, box) {
  const c = cropped(src, box);
  if (c === src && !rotate) return null;
  return rotate ? rotated(c, rotate) : c;
}
function encode(src) {
  const photo = draw(src, 1200).toDataURL('image/jpeg', 0.82).split(',')[1];
  const tc = draw(src, 240);
  let q = 0.72, thumb = tc.toDataURL('image/jpeg', q);
  while (thumb.length > 45000 && q > 0.3) { q -= 0.1; thumb = tc.toDataURL('image/jpeg', q); }
  return { photo, thumb };
}

async function addFiles(files) {
  if (!files.length) return;
  if (!cfg.url) { openCfg(); return; }
  const jobs = files.map((f, n) => ({ file: f, label: '待機中 ' + (n + 1) + '/' + files.length }));
  pending.unshift(...jobs); render();
  let ok = 0, aiErr = '';
  for (const job of jobs) {
    job.label = '登録中…'; render();
    try {
      const src = await decode(job.file);
      const j = await api('add', Object.assign(encode(src), { owner: $('fOwner').value, model: cfg.model || 'sonnet' }));
      const fixed = tidy(src, j.rotate, j.box);
      if (fixed) {
        job.label = '写真を整えています…'; render();
        try {
          const img = encode(fixed);
          const k = await api('replacePhoto', Object.assign({ id: j.item.id }, img));
          j.item.thumb = img.thumb; j.item.photoId = k.photoId;
        } catch (e) { }
      }
      items.push(j.item); ok++;
      if (j.aiError) aiErr = j.aiError;
    } catch (e) {
      toast('登録できませんでした: ' + e.message, 6000);
    }
    pending.splice(pending.indexOf(job), 1);
    persist(); buildOptions(); render();
  }
  if (ok) toast(aiErr ? ok + ' 点を登録しました（AI提案なし: ' + aiErr + '）' : ok + ' 点を登録しました。「要確認」をタップして内容を確認してください', 6000);
}

// ---------- 編集 ----------
function openEdit(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  editing = it;
  $('ePhoto').src = it.thumb || '';
  $('eName').value = it.name; $('eType').value = it.type; $('eOwner').value = it.owner;
  $('eColor').value = it.color; $('eStatus').value = it.status; $('ePlace').value = it.place;
  $('eVolume').value = it.volume; $('eMemo').value = it.memo; $('ePrice').value = it.price || ''; $('eHeat').checked = hasTag(it, 'HEATTECH');
  const ss = (it.seasons || '').split(',');
  for (const c of $('eSeasons').querySelectorAll('input')) c.checked = ss.includes(c.value);
  $('eInfo').textContent = (it.review === '未確認' ? 'AIの提案です。確認して保存してください。　' : '') + '登録: ' + it.created;
  $('eDelete').textContent = '完全に削除'; delete $('eDelete').dataset.armed;
  $('eDispose').hidden = it.status === '処分済み';
  $('dlgEdit').showModal();
  // 元の大きい写真は開いてから取得
  api('photo', { id }).then(j => { if (editing === it) $('ePhoto').src = 'data:image/jpeg;base64,' + j.photo; }).catch(() => { });
}
function defVol(type) { const t = meta.types.find(t => t.name === type); return t ? t.volume : 2; }

async function saveEdit(extra) {
  const it = editing;
  const fields = Object.assign({
    name: $('eName').value.trim(), type: $('eType').value, owner: $('eOwner').value.trim(),
    color: $('eColor').value.trim(), status: $('eStatus').value, place: $('ePlace').value.trim(),
    volume: Number($('eVolume').value) || 0, memo: $('eMemo').value.trim(), price: $('ePrice').value.trim(),
    tags: [...(it.tags || '').split(',').filter(t => t && t !== 'HEATTECH'), ...($('eHeat').checked ? ['HEATTECH'] : [])].join(','),
    seasons: [...$('eSeasons').querySelectorAll('input:checked')].map(c => c.value).join(','),
    review: '済'
  }, extra);
  $('eSave').disabled = true;
  try {
    const j = await api('update', { id: it.id, fields });
    Object.assign(it, j.item);
    persist(); buildOptions(); render();
    $('dlgEdit').close(); editing = null;
  } catch (e) { toast('保存できませんでした: ' + e.message, 6000); }
  $('eSave').disabled = false;
}

// ---------- 設定 ----------
function openCfg() {
  $('cUrl').value = cfg.url; $('cPass').value = cfg.pass; $('cModel').value = cfg.model || 'sonnet';
  $('dlgCfg').showModal();
}

// ---------- イベント ----------
$('btnAdd').onclick = () => cfg.url ? $('file').click() : openCfg();
$('file').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; addFiles(fs); };
$('btnCfg').onclick = openCfg;
$('count').onclick = () => { if ($('count').title) toast($('count').title); };
$('grid').onclick = e => {
  const t = e.target.closest('.tile[data-id]'); if (!t) return;
  if (!selMode) { openEdit(t.dataset.id); return; }
  selected.has(t.dataset.id) ? selected.delete(t.dataset.id) : selected.add(t.dataset.id);
  render();
};
$('btnSel').onclick = () => {
  selMode = !selMode; selected.clear();
  $('btnSel').textContent = selMode ? '変更を終了' : 'まとめて変更'; $('btnSel').classList.toggle('on', selMode);
  render();
};
$('bAll').onclick = () => { for (const i of visible()) selected.add(i.id); render(); };
$('bApply').onclick = async () => {
  const fields = {};
  if ($('bPlace').value.trim()) fields.place = $('bPlace').value.trim();
  if ($('bStatus').value) fields.status = $('bStatus').value;
  if (!selected.size) { toast('服をタップして選んでください'); return; }
  if (!Object.keys(fields).length) { toast('収納場所か状態を指定してください'); return; }
  $('bApply').disabled = true;
  try {
    const ids = [...selected];
    await api('bulk', { ids, fields });
    for (const it of items) if (selected.has(it.id)) Object.assign(it, fields);
    selected.clear(); $('bPlace').value = ''; $('bStatus').value = '';
    persist(); buildOptions(); render();
    toast(ids.length + ' 点を変更しました');
  } catch (e) { toast('変更できませんでした: ' + e.message, 6000); }
  $('bApply').disabled = false;
};
$('bTidy').onclick = async () => {
  if (!selected.size) { toast('服をタップして選んでください'); return; }
  const list = items.filter(i => selected.has(i.id)); let done = 0, changed = 0;
  $('bTidy').disabled = true;
  for (const it of list) {
    toast('写真を整えています… ' + (++done) + '/' + list.length, 60000);
    try {
      const j = await api('analyze', { id: it.id, model: cfg.model || 'sonnet' });
      const im = new Image(); im.src = 'data:image/jpeg;base64,' + j.photo; await im.decode();
      const fixed = tidy(im, j.rotate, j.box);
      if (!fixed) continue;
      const img = encode(fixed);
      const k = await api('replacePhoto', Object.assign({ id: it.id }, img));
      it.thumb = img.thumb; it.photoId = k.photoId; changed++; persist(); render();
    } catch (e) { toast('整えられませんでした: ' + e.message, 6000); }
  }
  $('bTidy').disabled = false;
  toast(changed + ' 点の写真を整えました');
};
function sumTable(title, list, keyFn) {
  const g = new Map();
  for (const it of list) for (const k of keyFn(it)) {
    const r = g.get(k) || { n: 0, v: 0 }; r.n++; r.v += Number(it.volume) || 0; g.set(k, r);
  }
  const h = document.createElement('h3'); h.textContent = title + '別';
  const tb = document.createElement('table');
  const row = (cells, tag) => { const tr = document.createElement('tr'); for (const c of cells) { const d = document.createElement(tag); d.textContent = c; tr.append(d); } return tr; };
  tb.append(row([title, '点数', 'かさ(L)'], 'th'), ...[...g].sort((a, b) => b[1].v - a[1].v).map(([k, r]) => row([k, r.n, Math.round(r.v * 10) / 10], 'td')));
  return [h, tb];
}
function boxCalc() {
  const cap = Number($('sBox').value) || 0; save(LS_BOX, cap);
  const vol = visible().reduce((a, i) => a + (Number(i.volume) || 0), 0);
  $('sumBox').textContent = cap > 0 ? '合計 約 ' + Math.round(vol) + ' L → 必要なBOXは 約 ' + Math.ceil(vol / (cap * 0.8)) + ' 個' : '';
}
$('btnSum').onclick = () => {
  const list = visible();
  $('sumBody').replaceChildren(
    ...sumTable('種類', list, i => [i.type || '（未設定）']),
    ...sumTable('季節', list, i => { const a = (i.seasons || '').split(',').filter(Boolean); return a.length ? a : ['（未設定）']; }),
    ...sumTable('収納場所', list, i => [i.place || '（未設定）']));
  $('sBox').value = load(LS_BOX) || 50; boxCalc();
  $('dlgSum').showModal();
};
$('sBox').oninput = boxCalc;
$('sClose').onclick = () => $('dlgSum').close();
for (const k of ['fType', 'fSeason', 'fOwner', 'fColor', 'fStatus', 'fReview']) $(k).onchange = () => {
  save(LS_FILTER, { fType: $('fType').value, fSeason: $('fSeason').value, fOwner: $('fOwner').value, fColor: $('fColor').value, fStatus: $('fStatus').value });
  render();
};
$('eType').onchange = () => {
  // かさが前の種類の既定値のままなら、新しい種類の既定値に合わせる
  if (editing && Number($('eVolume').value) === defVol(editing._type || editing.type)) $('eVolume').value = defVol($('eType').value);
  if (editing) editing._type = $('eType').value;
};
$('formEdit').onsubmit = e => { e.preventDefault(); saveEdit(); };
$('eCancel').onclick = () => { $('dlgEdit').close(); editing = null; };
$('eDispose').onclick = () => saveEdit({ status: '処分済み' });
$('eDelete').onclick = async () => {
  const b = $('eDelete');
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'もう一度押すと削除'; return; }
  const it = editing; b.disabled = true;
  try {
    await api('remove', { id: it.id });
    items = items.filter(i => i !== it); persist(); render();
    $('dlgEdit').close(); editing = null;
  } catch (e) { toast('削除できませんでした: ' + e.message, 6000); }
  b.disabled = false;
};
async function rotatePhoto(deg) {
  const it = editing; $('eRotL').disabled = $('eRotR').disabled = true;
  try {
    const j = await api('photo', { id: it.id });
    const im = new Image(); im.src = 'data:image/jpeg;base64,' + j.photo; await im.decode();
    const img = encode(rotated(im, deg));
    const k = await api('replacePhoto', Object.assign({ id: it.id }, img));
    it.thumb = img.thumb; it.photoId = k.photoId; persist(); render();
    if (editing === it) $('ePhoto').src = 'data:image/jpeg;base64,' + img.photo;
  } catch (e) { toast('回転できませんでした: ' + e.message, 6000); }
  $('eRotL').disabled = $('eRotR').disabled = false;
}
$('eRotL').onclick = () => rotatePhoto(270);
$('eRotR').onclick = () => rotatePhoto(90);
$('formCfg').onsubmit = e => {
  e.preventDefault();
  cfg = { url: $('cUrl').value.trim() || DEFAULT_URL, pass: $('cPass').value, model: $('cModel').value };
  save(LS_CFG, cfg); $('dlgCfg').close(); sync();
};
$('cCancel').onclick = () => $('dlgCfg').close();
$('cShare').onclick = async () => {
  const link = location.origin + location.pathname + '#u=' + encodeURIComponent($('cUrl').value.trim());
  try { await navigator.clipboard.writeText(link); toast('リンクをコピーしました。合言葉は別に伝えてください'); }
  catch (e) { toast(link, 15000); }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && !pending.length && !editing) sync(); });

// ---------- 起動 ----------
(async function init() {
  const m = location.hash.match(/^#u=(.+)$/);
  if (m && !cfg.url) { cfg.url = decodeURIComponent(m[1]); history.replaceState(null, '', location.pathname); }
  const [ci, cm] = await Promise.all([cacheGet('items'), cacheGet('meta')]);
  if (ci) items = ci;
  if (cm) meta = cm;
  buildOptions(); render();           // 前回のデータをすぐ表示
  if (!cfg.url || !cfg.pass) openCfg(); else sync();   // 最新は裏で取得
})();
</script>
